name: Docker Image CI

on:
  push:
    # run on any branch commit and any tag push
    branches: ["**"]
    tags: ["**"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  # Image repository on GitHub Container Registry
  # Note: IMAGE_NAME and IMAGE_TAG are computed at runtime in a step to
  # ensure the repository name is lowercased (docker/ghcr requires lowercase).

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Prepare image tag
      id: prepare_tag
      run: |
        # Prefer GITHUB_REF_NAME (branch or tag name). Fallback to last path segment of GITHUB_REF.
        if [ -n "${GITHUB_REF_NAME:-}" ]; then
          TAG="${GITHUB_REF_NAME}"
        else
          TAG="$(echo "$GITHUB_REF" | sed 's,.*/,,')"
        fi
        # Replace any slashes with dashes to make a valid Docker tag
        TAG="${TAG//\//-}"
        echo "Computed tag: $TAG"
        # Compute a lowercase image name from GITHUB_REPOSITORY (owner/repo)
        # Bash parameter expansion ${var,,} lowercases the value.
        IMAGE_NAME_LOWER="ghcr.io/${GITHUB_REPOSITORY,,}"
        echo "Computed image name: $IMAGE_NAME_LOWER"
        # Export image name to subsequent steps and as a step output
        echo "IMAGE_NAME=$IMAGE_NAME_LOWER" >> $GITHUB_ENV
        echo "image_name=$IMAGE_NAME_LOWER" >> $GITHUB_OUTPUT
        echo "tag=$TAG" >> $GITHUB_OUTPUT


    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: Dockerfile
        push: true
        tags: |
          ${{ steps.prepare_tag.outputs.image_name }}:${{ steps.prepare_tag.outputs.tag }}
