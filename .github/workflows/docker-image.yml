name: Docker Image CI

on:
  push:
    # run on any branch commit and any tag push
    branches: ["**"]
    tags: ["**"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  # Image repository on GitHub Container Registry
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  # Note: IMAGE_TAG is computed at runtime in a step (replace() is not
  # available in workflow expressions on all runners).

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Prepare image tag
      id: prepare_tag
      run: |
        # Prefer GITHUB_REF_NAME (branch or tag name). Fallback to last path segment of GITHUB_REF.
        if [ -n "${GITHUB_REF_NAME:-}" ]; then
          TAG="${GITHUB_REF_NAME}"
        else
          TAG="$(echo "$GITHUB_REF" | sed 's,.*/,,')"
        fi
        # Replace any slashes with dashes to make a valid Docker tag
        TAG="${TAG//\//-}"
        echo "Computed tag: $TAG"
        echo "tag=$TAG" >> $GITHUB_OUTPUT


    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: Dockerfile
        push: true
        tags: |
          ${{ env.IMAGE_NAME }}:${{ steps.prepare_tag.outputs.tag }}
